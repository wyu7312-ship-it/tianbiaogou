document.documentElement.dataset.wsaHostId = '__wsa_ltest_host__';
</script>
<script>
// ===== chrome.storage.local 垫片（独立键 + 假名字典）=====
(() => {
  const KEY = '__wsa_ltest_store__';
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { store = {}; }
  const listeners = [];
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  window.chrome = {
    storage: {
      local: {
        get(keys, cb) {
          let out = {};
          if (keys == null) out = clone(store);
          else if (typeof keys === 'string') { if (keys in store) out[keys] = clone(store[keys]); }
          else if (Array.isArray(keys)) keys.forEach((k) => { if (k in store) out[k] = clone(store[k]); });
          setTimeout(() => cb && cb(out), 0);
        },
        set(obj, cb) {
          const chg = {};
          Object.keys(obj).forEach((k) => { store[k] = clone(obj[k]); chg[k] = { newValue: clone(obj[k]) }; });
          save(); listeners.forEach((fn) => fn(chg, 'local'));
          if (cb) setTimeout(cb, 0);
        },
        remove(arr, cb) { arr.forEach((k) => { delete store[k]; }); save(); if (cb) setTimeout(cb, 0); },
      },
      onChanged: { addListener: (fn) => listeners.push(fn) },
    },
    runtime: { sendMessage: () => {}, getURL: (p) => p },
  };
  window.__store = () => clone(store);
  window.__reset = () => { store = {}; save(); };
})();
</script>

<script>
// 播种假名字典：复刻"本机已有 15 个概念有值、emergency/period 无值"的形态
(() => {
  const FILLED = {
    name: '张三', phone: '138xxxx0000', email: 'you@example.com', idno: '证件号示例X',
    birthdate: '199x.xx.xx', gender: '男', ethnicity: '汉', politics: '共青团员',
    hometown: '某某省某某市', school: '某某大学', education: '硕士', degree: '文学学位',
    major: '某某专业', grad_date: '2027.6.1', period: '2024.9.1',
  };
  __reset();
  const concepts = {};
  for (const c of window.WSA_CONCEPTS) concepts[c.id] = { userAliases: [], options: FILLED[c.id] ? [{ value: FILLED[c.id], tag: '' }] : [] };
  concepts.emergency.options = [];           // 关键：紧急联系人没有存过值
  chrome.storage.local.set({ wsa_dict_v2: { version: 2, concepts, custom: [] } });
})();
</script>
<script src="../content.js"></script>
<script>
// ===== 用例 =====
const R = { pass: 0, fail: 0, messages: [] };
function ok(name, cond) { if (cond) R.pass++; else { R.fail++; R.messages.push(name); } }
const tick = (ms) => new Promise((r) => setTimeout(r, ms || 80));
const $ = (id) => document.getElementById(id);
const HOST = '__wsa_ltest_host__';
function panel() { const h = $(HOST); return h && h.shadowRoot ? h.shadowRoot.querySelector('.panel') : null; }
function card() {
  const p = panel();
  if (!p || p.style.display === 'none') return { visible: false, title: '', rows: [], hint: '' };
  const hb = p.querySelector('.head .box');
  const hn = p.querySelector('.hint');
  return {
    visible: true,
    title: hb ? hb.textContent.replace('框：', '').trim() : '',
    hint: hn ? hn.textContent.trim() : '',
    rows: Array.from(p.querySelectorAll('.row')).filter((r) => !r.classList.contains('add'))
      .map((r) => r.textContent.trim().replace(/\s+/g, ' ')),
  };
}
async function focus(id) { $(id).blur(); await tick(25); $(id).focus(); await tick(170); return card(); }
async function clickRow(n) {
  const p = panel();
  const rows = Array.from(p.querySelectorAll('.row')).filter((r) => !r.classList.contains('add'));
  if (!rows[n]) return { toast: '' };
  rows[n].click();
  const t = p.querySelector('.toast');
  const toast = t ? t.textContent.trim() : '';
  await tick(120);
  return { toast };
}

// 标签识别：期望卡片标题
const LABELS = [
  ['t_a1', '姓名'], ['t_a2', '手机号码'], ['t_a3', '毕业院校'], ['t_a4', '是否服从调剂'],
  ['t_b1', '身份证号码'], ['t_b2', '政治面貌'], ['t_b3', '所学专业'], ['t_c1', '电子邮箱'],
  ['t_c2', '紧急联系人电话'], ['t_d1', '姓名'], ['t_d3', '联系电话'], ['t_d4', '学校名称'],
  ['t_e1', '民族'], ['t_e2', '籍贯'], ['t_f2', '验证码'],
];
// 必须"未识别"的（真无标签 / 纯计数）
const MUST_UNKNOWN = ['t_c3', 't_f1'];

window.__ltest = async () => {
  for (let i = 0; i < 40 && !window.__store().wsa_dict_v2; i++) await tick(50);

  for (const [id, exp] of LABELS) {
    const c = await focus(id);
    ok('标签 ' + id + ' → ' + exp + '（实得 ' + (c.title || '未识别') + '）',
      c.title.includes(exp) && !/^请输入|^请选择/.test(c.title));
  }
  for (const id of MUST_UNKNOWN) {
    const c = await focus(id);
    ok('应未识别 ' + id + '（实得 ' + (c.title || '未识别') + '）',
      (c.title === '' || c.title === '未识别') && !/^[\d/]+$/.test(c.title));
  }

  // 写入诚实性
  await focus('t_a1');
  const w1 = await clickRow(0);
  ok('W1 普通写入值正确', $('t_a1').value === '张三');
  ok('W1 toast 说已填入', /已填入/.test(w1.toast));

  const a2 = $('t_a2');
  a2.addEventListener('input', () => { a2.value = a2.value.replace(/\D/g, '').slice(0, 5); });
  await focus('t_a2');
  const w2 = await clickRow(0);
  ok('W2 被改写时 toast 不谎报成功', a2.value !== '138xxxx0000' && /改写|核对/.test(w2.toast));

  const a3 = $('t_a3');
  a3.addEventListener('change', () => { a3.value = ''; });
  await focus('t_a3');
  const w3 = await clickRow(0);
  ok('W3 被还原时 toast 报未生效', a3.value === '' && /未生效|手动/.test(w3.toast));

  await focus('t_g2');
  await clickRow(0);
  ok('W4 select 精确命中', $('t_g2').value === '共青团员');

  // 危险候选：紧急联系人电话不得列出本人手机号
  const s1 = await focus('t_c2');
  ok('S1 紧急联系人电话不列本人手机号', !s1.rows.some((r) => r.includes('138xxxx0000')));
  ok('S1 命中概念但无值时有明确提示', /还没存过|未识别/.test(s1.hint));

  // 过度匹配抑制：身份证框不捎带手机号；学校框不捎带毕业时间
  const s2 = await focus('t_b1');
  ok('S2 身份证框不捎带手机号', !s2.rows.some((r) => r.includes('138xxxx0000')));
  const s3 = await focus('t_d4');
  ok('S3 学校框不捎带毕业时间', !s3.rows.some((r) => r.includes('2027.6.1')));

  // 未修过头：联系电话仍命中手机号
  const s4 = await focus('t_d3');
  ok('S4 联系电话仍命中手机号', s4.rows.some((r) => r.includes('138xxxx0000')));

  // 记住：标签不可用时拒绝入库（不产生垃圾键）
  await focus('t_f1');
  $('t_f1').focus();
  $('t_f1').value = '随意值';
  $('t_f1').dispatchEvent(new Event('input', { bubbles: true }));
  await tick(40);
  const addBtn = panel().querySelector('.row.add');
  if (addBtn) addBtn.click();
  await tick(160);
  const custom = (window.__store().wsa_dict_v2 || {}).custom || [];
  ok('R1 未识别标签不写垃圾键', !custom.some((e) => /^t_f1$|请输入/.test(e.label)));

  document.getElementById('rep').textContent = JSON.stringify(R, null, 1);
  return JSON.stringify(R);
};
</script>
